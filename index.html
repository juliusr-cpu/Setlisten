<style>
  :root{
    --bg:#0e0d0d; --panel:#171515; --panel2:#1f1c1c; --line:#2c2828; --ink:#f4efef; --muted:#9b9090;
    --red:#d0102b; --red2:#ff3350; --soft:rgba(208,16,43,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--line);background:#000}
  header .brand{display:flex;align-items:center;gap:10px;margin-right:6px}
  header .brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 18px rgba(208,16,43,.45)}
  header .brand b{font-size:15px;letter-spacing:3px;text-transform:uppercase}
  .status{font-size:13px;color:var(--muted);flex:1;min-width:200px}
  .status.err{color:var(--red2)}
  button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
  button:hover{border-color:#4a4242}
  button.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 14px rgba(208,16,43,.35)}
  button.icon{padding:4px 9px;min-width:34px}
  button:disabled{opacity:.35;cursor:default}
  input[type=search],input[type=text],select,textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#0b0a0a;color:var(--ink)}
  main{flex:1;display:grid;grid-template-columns:minmax(300px,1fr) minmax(340px,1.15fr);gap:14px;padding:14px 16px;min-height:0}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .sechead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .sechead h2{font-size:14px;margin:0;flex:1;text-transform:uppercase;letter-spacing:2px}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700}
  .count{font-size:13px;color:var(--muted)}
  .target{font-size:13px;color:var(--muted);flex-basis:100%}
  .target b{color:var(--red2)}
  .list{overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
  .row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #221f1f}
  .row .nr{font-variant-numeric:tabular-nums;width:46px;text-align:right;color:var(--muted);flex:none}
  .row .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .lib .row{cursor:pointer}
  .lib .row:hover{background:var(--soft)}
  .lib .row .in{font-size:12px;color:var(--red2);font-weight:700;flex:none}
  .lib .row .plus{color:var(--red2);font-size:18px;flex:none}
  .set .row .pos{width:24px;color:var(--muted);font-size:13px;text-align:right;flex:none}
  .set .row .nr{color:#fff;font-weight:700}
  .set .row.drag{opacity:.4}
  .set .row.over{box-shadow:inset 0 2px 0 var(--red)}
  .set .row .grip{cursor:grab;color:#5a5050;user-select:none;padding:0 2px}
  .set .row.missing .ti{color:var(--red2)}
  .set .row.missing .ti::after{content:" (nicht mehr aktuell)";font-size:12px}
  .tools{display:flex;gap:4px;flex:none;align-items:center}
  .tools select{padding:4px;font-size:13px;max-width:96px}
  .settabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;background:#131111}
  .settabs .tab{border-radius:999px;padding:6px 14px}
  .settabs .tab.on{background:var(--red);border-color:var(--red);color:#fff}
  .settabs .tab.drop{border-color:var(--red2);box-shadow:0 0 0 2px var(--soft)}
  .settabs .tab small{opacity:.75;margin-left:5px}
  .setbar{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);align-items:center}
  .setbar strong{flex:1;text-transform:uppercase;letter-spacing:1.5px;font-size:14px}
  .empty{padding:30px 18px;color:var(--muted);text-align:center}
  .foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tabs{display:none}
  #fileInput,#importInput{display:none}
  /* Dialoge */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal.on{display:flex}
  .dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .dlg h3{margin:0 0 12px;font-size:16px}
  .dlg p{margin:0 0 14px;color:#d8cfcf}
  .dlg input{width:100%;margin-bottom:14px}
  .dlg .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .exp{width:min(980px,100%);max-height:100%;display:flex;flex-direction:column}
  .exp .pv{flex:1;min-height:0;overflow:auto;background:#2a2626;border-radius:10px;padding:12px;display:flex;justify-content:center;margin-bottom:12px}
  .exp .pv img{max-width:100%;height:auto;box-shadow:0 6px 30px rgba(0,0,0,.6);background:#fff;align-self:flex-start}
  .exp textarea{width:100%;height:160px;margin-bottom:12px;display:none}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#000;border:1px solid var(--red);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90%}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:760px){
    header{padding:8px 12px}
    header .brand img{width:36px;height:36px}
    header .brand b{display:none}
    .status{flex-basis:100%;order:5}
    main{grid-template-columns:1fr;padding:8px}
    .tabs{display:flex;gap:6px;padding:8px 8px 0}
    .tabs button{flex:1;padding:9px}
    .tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
    main section.hidden-m{display:none}
    .row{padding:11px 12px}
    .set .row .grip{display:none}
    .sechead #gigSelect{flex-basis:100%}
  }
</style>
</head>

/* ===================== Kleiner XLSX-Leser (ohne Bibliothek) ===================== */
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Keine gültige .xlsx-Datei.");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = {}, dec = new TextDecoder("utf-8");
  for (let k = 0; k < count; k++){
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loff = dv.getUint32(p + 42, true);
    files[dec.decode(u8.subarray(p + 46, p + 46 + nlen))] = { method, csize, loff };
    p += 46 + nlen + xlen + clen;
  }
  return {
    async text(name){
      const f = files[name]; if (!f) return null;
      const start = f.loff + 30 + dv.getUint16(f.loff + 26, true) + dv.getUint16(f.loff + 28, true);
      const raw = u8.subarray(start, start + f.csize);
      if (f.method === 0) return dec.decode(raw);
      if (f.method !== 8) throw new Error("Unbekannte Komprimierung in der Datei.");
      if (typeof DecompressionStream === "undefined") throw new Error("Dieser Browser ist zu alt (iPhone: bitte iOS aktualisieren).");
      return await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    }
  };
}
const xml = s => new DOMParser().parseFromString(s, "application/xml");
const kids = (el, tag) => Array.from(el.getElementsByTagNameNS("*", tag));

async function readSongs(buf){
  const z = await unzip(buf);
  const wb = xml(await z.text("xl/workbook.xml"));
  const sheet = kids(wb, "sheet").find(s => s.getAttribute("name").trim() === SHEET_NAME);
  if (!sheet) throw new Error(`Blatt „${SHEET_NAME}“ nicht gefunden.`);
  const rid = sheet.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id") || sheet.getAttribute("r:id");
  const rel = kids(xml(await z.text("xl/_rels/workbook.xml.rels")), "Relationship").find(r => r.getAttribute("Id") === rid);
  const path = "xl/" + rel.getAttribute("Target").replace(/^\/?xl\//, "").replace(/^\//, "");
  let shared = [];
  const ssTxt = await z.text("xl/sharedStrings.xml");
  if (ssTxt) shared = kids(xml(ssTxt), "si").map(si =>
    kids(si, "t").filter(t => t.parentNode.localName !== "rPh").map(t => t.textContent).join(""));
  const songs = [];
  for (const row of kids(xml(await z.text(path)), "row")){
    if (+row.getAttribute("r") < FIRST_ROW) continue;
    const v = {};
    for (const c of kids(row, "c")){
      const col = (c.getAttribute("r") || "").replace(/\d+/g, "");
      if (col !== COL_NR && col !== COL_TITLE && col !== COL_FILTER) continue;
      const t = c.getAttribute("t"); let val = "";
      if (t === "inlineStr") val = kids(c, "t").map(x => x.textContent).join("");
      else { const e = kids(c, "v")[0]; val = e ? e.textContent : "";
             if (t === "s") val = shared[+val] ?? ""; else if (t === "e") val = ""; }
      v[col] = String(val).trim();
    }
    if ((v[COL_FILTER] || "").toLowerCase() !== "x") continue;
    const title = v[COL_TITLE] || "", nr = v[COL_NR] === "0" ? "" : (v[COL_NR] || "");
    if (!title || title === "0") continue;
    songs.push({ nr, title });
  }
  songs.sort((a, b) => (parseFloat(a.nr) || 1e9) - (parseFloat(b.nr) || 1e9) || a.title.localeCompare(b.title, "de"));
  return songs;
}

/* ===================== Umgebung & Speicher ===================== */
// Alle Daten bleiben ausschließlich auf diesem Gerät (Browser-Speicher). Kein Konto, keine Internetverbindung nötig.
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const idb = {
  open(){ return new Promise((res, rej) => { const q = indexedDB.open("setlisten", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("kv"); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async put(k, v){ try { const db = await this.open(); db.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch {} },
  async get(k){ try { const db = await this.open(); return await new Promise(r => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch { return null; } }
};
function persist(){ store.set(LS_DATA, data); store.set(LS_SONGS, songs); }

/* ===================== Datenmodell: Gigs → Sets → Stücke ===================== */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const mkSet = name => ({ id: uid(), name, items: [] });
const mkGig = name => { const s = mkSet("Set 1"); return { id: uid(), name, sets: [s], cur: s.id }; };
function migrate(old){
  return { current: null, gigs: old.sets.map(s => {
    const g = { id: uid(), name: s.name, sets: [], cur: null }; let set = mkSet("Set 1"); g.sets.push(set);
    for (const it of s.items){
      if (it.pause){ if (set.items.length){ set = mkSet("Set " + (g.sets.length + 1)); g.sets.push(set); } }
      else set.items.push({ nr: it.nr, title: it.title });
    }
    g.cur = g.sets[0].id; return g; }) };
}
function normalize(d){
  if (!d || !Array.isArray(d.gigs)) d = { current: null, gigs: [] };
  if (!d.gigs.length) d.gigs.push(mkGig("Gig " + new Date().toLocaleDateString("de-DE")));
  d.gigs.forEach(g => { if (!g.sets.length) g.sets.push(mkSet("Set 1")); if (!g.sets.find(s => s.id === g.cur)) g.cur = g.sets[0].id; });
  if (!d.gigs.find(g => g.id === d.current)) d.current = d.gigs[0].id;
  return d;
}
let data = store.get(LS_DATA, null);
if (!data){ const old = store.get(LS_OLD, null); data = old && old.sets ? migrate(old) : null; }
data = normalize(data);
let songs = store.get(LS_SONGS, { list: [], file: "", at: "" });
let fileHandle = null;

const gig = () => data.gigs.find(g => g.id === data.current);
const set = () => gig().sets.find(s => s.id === gig().cur);

/* ===================== Dialoge & Hinweise ===================== */
function dialog({ title, text = "", input = null, buttons }){
  return new Promise(res => {
    $("dlgTitle").textContent = title; $("dlgText").textContent = text; $("dlgText").style.display = text ? "" : "none";
    const inp = $("dlgInput"); inp.style.display = input === null ? "none" : ""; inp.value = input ?? "";
    const bx = $("dlgBtns"); bx.innerHTML = "";
    const done = v => { $("dlgModal").classList.remove("on"); inp.onkeydown = null; res(v); };
    buttons.forEach((b, i) => { const el = document.createElement("button"); el.textContent = b.label; if (b.primary) el.className = "primary";
      el.onclick = () => done(b.value === "input" ? inp.value.trim() : b.value); bx.appendChild(el); });
    inp.onkeydown = e => { if (e.key === "Enter") done(inp.value.trim()); if (e.key === "Escape") done(null); };
    $("dlgModal").classList.add("on");
    if (input !== null) setTimeout(() => { inp.focus(); inp.select(); }, 50);
  });
}
const ask = (title, value) => dialog({ title, input: value, buttons: [{ label: "Abbrechen", value: null }, { label: "OK", value: "input", primary: true }] });
const confirmBox = (title, text, ok = "Löschen") => dialog({ title, text, buttons: [{ label: "Abbrechen", value: false }, { label: ok, value: true, primary: true }] });
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function saveFile(name, blob){
  // iPhone/iPad: Teilen-Menü (In „Dateien“ sichern, WhatsApp, Drucken …)
  if (isIOS && navigator.canShare){
    const file = new File([blob], name, { type: blob.type || "application/octet-stream" });
    if (navigator.canShare({ files: [file] })){
      navigator.share({ files: [file], title: name }).catch(e => { if (e.name !== "AbortError") toast("Teilen nicht möglich: " + e.message); });
      return;
    }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
const safe = n => n.replace(/[\\/:*?"<>|]+/g, "_").trim() || "Setliste";

/* ===================== Laden der Excel ===================== */
let canPick = false;
try { canPick = "showOpenFilePicker" in window && window.self === window.top; } catch {}
function showLoaded(){
  if (songs.list.length) setStatus(`${songs.list.length} aktuelle Stücke aus „${songs.file}“ (Stand ${songs.at}).`);
}
async function loadFromFile(file){
  setStatus("Lese " + file.name + " …");
  try {
    const list = await readSongs(await file.arrayBuffer());
    songs = { list, file: file.name, at: new Date().toLocaleString("de-DE") };
    persist(); showLoaded(); renderAll(); toast(list.length + " Stücke geladen");
  } catch (e){ setStatus("Fehler: " + e.message, true); }
}
$("btnLoad").onclick = async () => {
  if (canPick){
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: "Excel", accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx", ".xlsm"] } }] });
      fileHandle = h; idb.put("handle", h); await loadFromFile(await h.getFile());
    } catch (e){ if (e.name !== "AbortError") $("fileInput").click(); }
  } else $("fileInput").click();
};
$("fileInput").onchange = e => { const f = e.target.files[0]; if (f) loadFromFile(f); e.target.value = ""; };
$("btnReload").onclick = async () => {
  if (canPick){
    if (!fileHandle) fileHandle = await idb.get("handle");
    if (fileHandle){
      try {
        if ((await fileHandle.queryPermission({ mode: "read" })) !== "granted" &&
            (await fileHandle.requestPermission({ mode: "read" })) !== "granted") throw new Error("Zugriff verweigert");
        return loadFromFile(await fileHandle.getFile());
      } catch (e){ setStatus("Bitte die Datei neu auswählen (" + e.message + ").", true); }
    }
  }

/* ===================== Export-Layout (eine Seite, alle Sets) ===================== */
// Das Layout wird einmal berechnet und dann als PDF (Vektor) oder Bild gezeichnet.
const FONT = "Helvetica, Arial, 'Liberation Sans', sans-serif";
const mctx = document.createElement("canvas").getContext("2d");
const mcache = new Map();
function tw(s, size, bold, sp = 0){
  const k = (bold ? "b" : "n") + "|" + s;
  let w = mcache.get(k);
  if (w === undefined){ mctx.font = (bold ? "bold " : "") + "100px " + FONT; w = mctx.measureText(s).width / 100; mcache.set(k, w); }
  return w * size + sp * Math.max(0, s.length - 1);
}
function wrap(s, size, bold, maxW){
  const words = s.split(/\s+/).filter(Boolean), lines = []; let line = "";
  for (let w of words){
    const tryL = line ? line + " " + w : w;
    if (tw(tryL, size, bold) <= maxW){ line = tryL; continue; }
    if (line) lines.push(line);
    while (tw(w, size, bold) > maxW && w.length > 1){        // überlanges Wort trennen
      let i = w.length - 1; while (i > 1 && tw(w.slice(0, i) + "-", size, bold) > maxW) i--;
      lines.push(w.slice(0, i) + "-"); w = w.slice(i);
    }
    line = w;
  }
  if (line) lines.push(line);
  return lines.length ? lines : [""];
}
function fitText(s, size, bold, maxW, sp = 0){
  if (tw(s, size, bold, sp) <= maxW) return s;
  while (s.length > 1 && tw(s + "…", size, bold, sp) > maxW) s = s.slice(0, -1);
  return s + "…";
}

function layoutPage(g, sets, o){
  const land = o.land, W = land ? 842 : 595, H = land ? 595 : 842, M = 26, fs = o.fs;
  const ops = [], T = (x, y, s, size, bold, c, align = "left", sp = 0) => {
    const w = tw(s, size, bold, sp); if (align === "right") x -= w; else if (align === "center") x -= w / 2;
    ops.push({ t: "text", x, y, s, size, bold, c, sp });
  };
  // Kopfbereich: schwarzes Band mit Logo
  const bandH = land ? 76 : 88, logo = bandH - 16;
  ops.push({ t: "rect", x: 0, y: 0, w: W, h: bandH, c: "#0b0b0b" });
  ops.push({ t: "img", x: M - 4, y: 8, w: logo, h: logo });
  const tx = M - 4 + logo + 14, tmax = W - tx - M;
  let tsize = land ? 24 : 22; const title = g.name.toUpperCase();
  while (tsize > 12 && tw(title, tsize, true, tsize * .06) > tmax) tsize -= .5;
  T(tx, bandH / 2 + 2, fitText(title, tsize, true, tmax, tsize * .06), tsize, true, "#ffffff", "left", tsize * .06);
  const total = sets.reduce((a, s) => a + s.items.length, 0);
  const sub = `${sets.length} SET${sets.length === 1 ? "" : "S"}  ·  ${total} STÜCKE`;
  T(tx, bandH / 2 + 2 + 17, sub, 9, true, "#ff3350", "left", 1.3);
  T(tx + tw(sub, 9, true, 1.3) + 12, bandH / 2 + 2 + 17, "Stand " + new Date().toLocaleDateString("de-DE"), 8.5, false, "#9b9090");
  ops.push({ t: "rect", x: 0, y: bandH, w: W, h: 3, c: RED });

  // Spalten
  const top = bandH + 3 + 18, bottom = H - M, gap = 16, cols = o.cols;
  const colW = (W - 2 * M - gap * (cols - 1)) / cols;
  const headH = fs * 1.75, headGap = fs * .35, pad = fs * .44, lineH = fs * 1.2, setGap = fs * 1.15;
  const posW = fs * 1.55;
  const nrW = Math.max(fs * 1.6, ...sets.flatMap(s => s.items.map(it => tw(it.nr, fs, true)))) + fs * .55;
  const titleW = colW - posW - nrW - fs * .4;
  if (titleW < fs * 5) return { ok: false };
  let col = 0, y = top, maxY = top;
  const cx = () => M + col * (colW + gap);
  const header = (s, cont) => {
    const x = cx();
    ops.push({ t: "rect", x, y, w: colW, h: headH, c: RED });
    ops.push({ t: "rect", x, y, w: fs * .22, h: headH, c: "#8a0a1d" });
    const name = s.name.toUpperCase(), nw = tw(name, fs * .95, true, fs * .07), avail = colW - fs * 1.8;
    let right = cont ? "Fortsetzung" : `${s.items.length} Stücke`;
    if (nw + tw(right, fs * .66, false) > avail) right = cont ? "Forts." : String(s.items.length);
    const rw = tw(right, fs * .66, false);
    T(x + fs * .65, y + headH * .5 + fs * .33, fitText(name, fs * .95, true, avail - rw, fs * .07), fs * .95, true, "#ffffff", "left", fs * .07);
    T(x + colW - fs * .55, y + headH * .5 + fs * .24, right, fs * .66, false, "#ffd6dc", "right");
    y += headH + headGap;
  };
  const rows = sets.map(s => s.items.map(it => { const L = wrap(it.title, fs, false, titleW); return { it, L, h: L.length * lineH + pad }; }));
  const nextCol = () => { col++; y = top; return col < cols; };
  for (let k = 0; k < sets.length; k++){
    const s = sets[k], R = rows[k];
    if (k > 0){
      if (o.split){ if (!nextCol()) return { ok: false }; }
      else y += setGap;
    }
    const need = headH + headGap + R.slice(0, 2).reduce((a, r) => a + r.h, 0);
    if (y + need > bottom && y > top && !nextCol()) return { ok: false };
    header(s, false);
    R.forEach((r, i) => {
      if (y + r.h > bottom){ if (!nextCol()) throw 0; header(s, true); }
      const x = cx();
      if (i % 2 === 1) ops.push({ t: "rect", x, y, w: colW, h: r.h, c: "#f3f0f0" });
      const base = y + pad / 2 + fs * .86;
      T(x + posW - fs * .3, base, (i + 1) + ".", fs * .62, false, "#9a9a9a", "right");
      T(x + posW + nrW - fs * .45, base, r.it.nr, fs, true, RED, "right");
      r.L.forEach((l, j) => T(x + posW + nrW, base + j * lineH, l, fs, false, "#141414"));
      y += r.h; maxY = Math.max(maxY, y);
    });
  }
  return { ok: true, ops, W, H, fs, fill: maxY };
}
function safeLayout(g, sets, o){ try { return layoutPage(g, sets, o); } catch { return { ok: false }; } }
function bestLayout(g, sets){
  let best = null;
  for (const land of [false, true]){
    for (let cols = 1; cols <= Math.min(land ? 5 : 4, Math.max(sets.length, 3)); cols++){
      for (const split of sets.length === cols ? [true, false] : [false]){
        let lo = 4, hi = 26, okL = null;
        for (let k = 0; k < 11; k++){
          const mid = (lo + hi) / 2, L = safeLayout(g, sets, { land, cols, split, fs: mid });
          if (L.ok){ lo = mid; okL = L; } else hi = mid;
        }
        if (okL && (!best || okL.fs > best.fs + .25)) best = okL;
      }
    }
  }
  return best;
}

/* ---------- Zeichnen auf Canvas (Vorschau / Bild) ---------- */
let logoImg = null;
function loadLogo(){ return logoImg ? Promise.resolve(logoImg) : new Promise(r => { const i = new Image(); i.onload = () => { logoImg = i; r(i); }; i.onerror = () => r(null); i.src = LOGO; }); }
function drawCanvas(L, scale){
  const c = document.createElement("canvas"); c.width = Math.round(L.W * scale); c.height = Math.round(L.H * scale);
  const x = c.getContext("2d"); x.scale(scale, scale); x.fillStyle = "#fff"; x.fillRect(0, 0, L.W, L.H); x.textBaseline = "alphabetic";
  for (const o of L.ops){
    if (o.t === "rect"){ x.fillStyle = o.c; x.fillRect(o.x, o.y, o.w, o.h); }
    else if (o.t === "img"){ if (logoImg) x.drawImage(logoImg, o.x, o.y, o.w, o.h); }
    else {
      x.fillStyle = o.c; x.font = (o.bold ? "bold " : "") + o.size + "px " + FONT;
      if (!o.sp) x.fillText(o.s, o.x, o.y);
      else { let px = o.x; for (const ch of o.s){ x.fillText(ch, px, o.y); px += tw(ch, o.size, o.bold) + o.sp; } }
    }
  }
  return c;
}

/* ---------- Eigener kleiner PDF-Schreiber (Vektor-Text, Helvetica) ---------- */
const WIN = { 0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87, 0x02C6: 0x88, 0x2030: 0x89, 0x0160: 0x8A, 0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E,
  0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97, 0x02DC: 0x98, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x0153: 0x9C, 0x017E: 0x9E, 0x0178: 0x9F };
const pdfHex = s => "<" + Array.from(s).map(ch => { const u = ch.codePointAt(0); const b = (u >= 0x20 && u < 0x7F) || (u >= 0xA0 && u <= 0xFF) ? u : (WIN[u] || 0x3F); return b.toString(16).padStart(2, "0"); }).join("") + ">";
const rgb = hex => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => (v / 255).toFixed(3)).join(" "); };
const f2 = n => (Math.round(n * 100) / 100).toString();
async function deflate(u8){
  if (typeof CompressionStream === "undefined") return null;
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream("deflate"))).arrayBuffer());
}
async function makePdf(L){
  const H = L.H; let cs = "";
  for (const o of L.ops){
    if (o.t === "rect") cs += `${rgb(o.c)} rg ${f2(o.x)} ${f2(H - o.y - o.h)} ${f2(o.w)} ${f2(o.h)} re f\n`;
    else if (o.t === "img") cs += `q ${f2(o.w)} 0 0 ${f2(o.h)} ${f2(o.x)} ${f2(H - o.y - o.h)} cm /Im1 Do Q\n`;
    else cs += `BT /${o.bold ? "F2" : "F1"} ${f2(o.size)} Tf ${rgb(o.c)} rg ${f2(o.sp || 0)} Tc 1 0 0 1 ${f2(o.x)} ${f2(H - o.y)} Tm ${pdfHex(o.s)} Tj ET\n`;
  }
  // Logo als RGB + Alphamaske
  const img = await loadLogo(), S = 300;
  const c = document.createElement("canvas"); c.width = c.height = S; const cx = c.getContext("2d");
  if (img) cx.drawImage(img, 0, 0, S, S);
  const px = cx.getImageData(0, 0, S, S).data, rgbA = new Uint8Array(S * S * 3), al = new Uint8Array(S * S);
  for (let i = 0, j = 0; i < S * S; i++){ rgbA[j++] = px[i * 4]; rgbA[j++] = px[i * 4 + 1]; rgbA[j++] = px[i * 4 + 2]; al[i] = px[i * 4 + 3]; }
  const enc = new TextEncoder(), csB = enc.encode(cs);
  const [csZ, imZ, alZ] = await Promise.all([deflate(csB), deflate(rgbA), deflate(al)]);
  const stream = (dict, raw, z) => [enc.encode(`<< ${dict}${z ? " /Filter /FlateDecode" : ""} /Length ${(z || raw).length} >>\nstream\n`), z || raw, enc.encode("\nendstream")];
  const objs = [
    [enc.encode("<< /Type /Catalog /Pages 2 0 R >>")],
    [enc.encode("<< /Type /Pages /Kids [3 0 R] /Count 1 >>")],
    [enc.encode(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${L.W} ${L.H}] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> /XObject << /Im1 7 0 R >> >> /Contents 4 0 R >>`)],
    stream("", csB, csZ),
    [enc.encode("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>")],
    [enc.encode("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>")],
    stream(`/Type /XObject /Subtype /Image /Width ${S} /Height ${S} /ColorSpace /DeviceRGB /BitsPerComponent 8 /SMask 8 0 R`, rgbA, imZ),
    stream(`/Type /XObject /Subtype /Image /Width ${S} /Height ${S} /ColorSpace /DeviceGray /BitsPerComponent 8`, al, alZ)
  ];
  const parts = [enc.encode("%PDF-1.4\n"), new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A])];
  let off = parts.reduce((a, p) => a + p.length, 0); const xref = [];
  objs.forEach((o, i) => {
    xref.push(off);
    const chunk = [enc.encode(`${i + 1} 0 obj\n`), ...o, enc.encode("\nendobj\n")];
    chunk.forEach(p => { parts.push(p); off += p.length; });
  });
  parts.push(enc.encode(`xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + xref.map(x => String(x).padStart(10, "0") + " 00000 n \n").join("") +
    `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R /Info << /Producer (Setlisten) >> >>\nstartxref\n${off}\n%%EOF\n`));
  return new Blob(parts, { type: "application/pdf" });
}

  const txt = gigText(), ta = $("expText");
  const show = () => { ta.value = txt; ta.style.display = "block"; ta.focus(); ta.select(); toast("Text markiert – jetzt kopieren"); };
  try { navigator.clipboard.writeText(txt).then(() => toast("Text in die Zwischenablage kopiert"), show); } catch { show(); }
};

/* ===================== Datensicherung ===================== */
$("btnExport").onclick = () => saveFile("Setlisten-Sicherung-" + new Date().toISOString().slice(0, 10) + ".json",
  new Blob([JSON.stringify({ data, songs }, null, 1)], { type: "application/json" }));
$("btnImport").onclick = () => $("importInput").click();
$("importInput").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    let d = JSON.parse(await f.text()), sg = null;
    if (d.data && d.data.gigs){ sg = d.songs; d = d.data; }
    if (Array.isArray(d.sets) && !d.gigs) d = migrate(d);
    if (!Array.isArray(d.gigs)) throw new Error("Unbekanntes Format");
    const how = await dialog({ title: "Sicherung wiederherstellen", text: `${d.gigs.length} Gig(s) gefunden. Vorhandene Gigs ersetzen oder ergänzen?`,
      buttons: [{ label: "Abbrechen", value: null }, { label: "Ergänzen", value: "add" }, { label: "Ersetzen", value: "rep", primary: true }] });
    if (!how) return;
    if (how === "rep") data = d; else d.gigs.forEach(g => { g.id = uid(); data.gigs.push(g); });
    if (sg && sg.list && !songs.list.length) songs = sg;
    data = normalize(data); save(); showLoaded(); renderAll(); toast(`${d.gigs.length} Gig(s) wiederhergestellt`);
  } catch (err){ setStatus("Sicherung konnte nicht gelesen werden: " + err.message, true); }
};

/* ===================== Mobile Tabs ===================== */
$("tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("secLib").classList.toggle("hidden-m", b.dataset.tab !== "lib");
  $("secSet").classList.toggle("hidden-m", b.dataset.tab !== "set");
};
$("secSet").classList.add("hidden-m");

/* ===================== Start ===================== */
store.set(LS_DATA, data);
showLoaded();
renderAll();
// Offline-Betrieb: beim ersten Aufruf über eine Webadresse wird die App auf dem Gerät zwischengespeichert
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
</script>
</body>
